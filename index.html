
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeSpace</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <!-- Left Section -->
        <div class="left-section">

            <!-- Three-Line Menu -->
            <button
                class="menu-button"
                id="menuButton"
                aria-label="Open menu"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- Logo -->
            <div class="logo">
                CodeSpace
            </div>

        </div>


        <!-- Profile Button -->
        <button
            class="profile-button"
            id="profileButton"
            aria-label="Open profile"
        >
            A
        </button>

    </nav>


    <!-- Sliding Menu -->
    <aside
        class="side-menu"
        id="sideMenu"
    >

        <div class="side-header">

            <h2>Menu</h2>

            <button
                class="close-menu"
                id="closeMenu"
                aria-label="Close menu"
            >
                ×
            </button>

        </div>

        <div class="menu-content">

            <!-- Menu options will be added later -->

            <button id="about" class="elements">About us</button><br>
            <button id="contest" class="elements">Contest</button><br>
            <button id="resources" class="elements">Resources</button><br>
            <button id="leaderboard" class="elements">Leaderboard</button><br>
            <button id="updates" class="elements">Updates</button><br>
            

            

        </div>

    </aside>


    <!-- Profile Panel -->
    <div
        class="profile-panel"
        id="profilePanel"
    >

        <div class="profile-top">

            <div class="profile-avatar">
                A
            </div>

            <div>
                <div class="profile-name">
                    User
                </div>

                <div class="profile-status">
                    Profile
                </div>
            </div>

        </div>

        <!-- Profile options will be added later -->

    </div>


    <!-- Background Overlay -->
    <div
        class="overlay"
        id="overlay"
    ></div>


    <!-- Main Content -->
    <main class="main">

        <div class="welcome">

            <h1>CodeClub</h1>

            <p>
                Your coding platform starts here.
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
